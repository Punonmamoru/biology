<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f7f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171a" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<title>BIOLOGY 生物シミュレーター</title>
<style>
/* ===== テーマ（色はすべてトークン経由。グラフも同じトークンを読む） ===== */
:root {
  color-scheme: light;
  --bg: #f6f7f4;
  --surface: #ffffff;
  --surface-2: #eef1ec;
  --fg: #1b1f1d;
  --muted: #59625d;
  --line: #cdd4cf;
  --grid: #e3e8e4;
  --accent: #1f7a4d;
  --accent-fg: #ffffff;
  --accent-soft: #dcefe3;
  --ok: #1b7a3a;
  --ok-soft: #dff3e5;
  --ng: #b3261e;
  --ng-soft: #fbe3e1;
  --warn: #8a5a00;
  --c1: #1f5fbf;   /* 系列1：青 */
  --c2: #c4441a;   /* 系列2：朱 */
  --c3: #1e7f45;   /* 系列3：緑 */
  --c4: #7a3fb0;   /* 系列4：紫 */
  --c5: #8a6a00;   /* 系列5：黄土 */
  --region: rgba(31, 95, 191, 0.08);
  --region-2: rgba(196, 68, 26, 0.08);
  --region-3: rgba(30, 127, 69, 0.22);
  --region-4: rgba(138, 106, 0, 0.10);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 2px 8px rgba(0, 0, 0, 0.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #14171a;
    --surface: #1d2125;
    --surface-2: #262b30;
    --fg: #eef1ef;
    --muted: #a9b3ad;
    --line: #3d454c;
    --grid: #2c3238;
    --accent: #5fd09a;
    --accent-fg: #0d1a13;
    --accent-soft: #1f3a2c;
    --ok: #6fdc95;
    --ok-soft: #1c3826;
    --ng: #ff8a80;
    --ng-soft: #42211f;
    --warn: #f0c060;
    --c1: #7fb2ff;
    --c2: #ff9a6b;
    --c3: #6fdc95;
    --c4: #d3a6ff;
    --c5: #f0c95a;
    --region: rgba(127, 178, 255, 0.12);
    --region-2: rgba(255, 154, 107, 0.12);
    --region-3: rgba(111, 220, 149, 0.22);
    --region-4: rgba(240, 201, 90, 0.10);
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #14171a;
  --surface: #1d2125;
  --surface-2: #262b30;
  --fg: #eef1ef;
  --muted: #a9b3ad;
  --line: #3d454c;
  --grid: #2c3238;
  --accent: #5fd09a;
  --accent-fg: #0d1a13;
  --accent-soft: #1f3a2c;
  --ok: #6fdc95;
  --ok-soft: #1c3826;
  --ng: #ff8a80;
  --ng-soft: #42211f;
  --warn: #f0c060;
  --c1: #7fb2ff;
  --c2: #ff9a6b;
  --c3: #6fdc95;
  --c4: #d3a6ff;
  --c5: #f0c95a;
  --region: rgba(127, 178, 255, 0.12);
  --region-2: rgba(255, 154, 107, 0.12);
  --region-3: rgba(111, 220, 149, 0.22);
  --region-4: rgba(240, 201, 90, 0.10);
  --shadow: none;
}

/* ===== 基本 ===== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
  font-size: 16px;
  line-height: 1.65;
  min-height: 100vh;
  padding-bottom: env(safe-area-inset-bottom);
}
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { line-height: 1.35; margin: 0 0 0.5em; }
h1 { font-size: 1.35rem; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
p { margin: 0 0 0.75em; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* ===== トップバー ===== */
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 4px;
  padding: calc(env(safe-area-inset-top) + 4px) 8px 4px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.brand {
  font-weight: 800; letter-spacing: 0.12em; text-decoration: none;
  color: var(--fg); padding: 0 8px; min-height: 44px; display: inline-flex; align-items: center;
}
.topbar-spacer { flex: 1; }
.icon-btn {
  min-width: 44px; min-height: 44px; border: 0; background: transparent;
  font-size: 1.25rem; border-radius: 10px; cursor: pointer;
}
.icon-btn:hover { background: var(--surface-2); }

/* ===== レイアウト ===== */
main:focus, main:focus-visible { outline: none; }
main { display: block; max-width: 760px; margin: 0 auto; padding: 12px 16px 48px; outline: none; }
.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px; margin: 0 0 12px; box-shadow: var(--shadow);
}
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.stack > * + * { margin-top: 8px; }
.grow { flex: 1 1 auto; }

/* ===== ボタン ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 8px 14px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--fg);
  font-weight: 600; text-decoration: none; cursor: pointer; text-align: center;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }

/* タブ・セグメント */
.tabs, .seg { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
.tabs [role="tab"], .seg button {
  flex: 1 1 0; min-height: 44px; padding: 6px 10px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer;
}
.tabs [role="tab"][aria-selected="true"], .seg button[aria-pressed="true"] {
  background: var(--accent); color: var(--accent-fg); border-color: var(--accent);
}

/* ===== ホーム ===== */
.hero { margin: 4px 0 12px; }
.hero h1 { font-size: 1.5rem; margin-bottom: 2px; }
.stage-card { display: grid; gap: 8px; }
.stage-head { display: flex; gap: 10px; align-items: baseline; }
.stage-code {
  font-weight: 800; font-size: 0.85rem; padding: 2px 8px; border-radius: 8px;
  background: var(--accent-soft); color: var(--fg); white-space: nowrap;
}
.stage-title { font-weight: 700; font-size: 1.05rem; }
.stage-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.stage-actions .btn { padding: 6px 4px; font-size: 0.9rem; }
.progress { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
.progress > span { display: block; height: 100%; background: var(--accent); }
.home-links { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* ===== 図解道場 ===== */
.badge-model {
  display: inline-block; font-size: 0.78rem; padding: 1px 8px; border-radius: 99px;
  border: 1px dashed var(--muted); color: var(--muted); margin-left: 4px; vertical-align: middle;
}
.chart-wrap { position: relative; width: 100%; }
.chart-wrap canvas { display: block; width: 100%; height: auto; touch-action: pan-y; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 6px 0 0; padding: 0; list-style: none; font-size: 0.875rem; }
.legend li { display: inline-flex; align-items: center; gap: 6px; }
.legend canvas { width: 34px; height: 12px; }
.control { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; margin: 10px 0; }
.control label { font-weight: 600; font-size: 0.95rem; }
.control output { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 4.5em; text-align: right; }
.control input[type="range"] { grid-column: 1 / -1; width: 100%; min-height: 44px; accent-color: var(--accent); margin: 0; }
.explain { border-left: 4px solid var(--accent); background: var(--accent-soft); padding: 10px 12px; border-radius: 0 10px 10px 0; }
.explain p:last-child { margin-bottom: 0; }
.tasks { list-style: none; margin: 0; padding: 0; }
.tasks li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); }
.tasks li:first-child { border-top: 0; }
.task-mark {
  flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line);
  display: inline-flex; align-items: center; justify-content: center; font-weight: 800;
}
.tasks li.done .task-mark { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.tasks li.done .task-text::after { content: "（達成）"; color: var(--ok); font-weight: 700; }
.calc-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.calc-grid label { display: grid; gap: 2px; font-size: 0.9rem; font-weight: 600; }
.calc-grid input, .field input, .field textarea {
  min-height: 44px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); width: 100%;
}
table.data { width: 100%; border-collapse: collapse; font-size: 0.92rem; font-variant-numeric: tabular-nums; }
table.data th, table.data td { border-bottom: 1px solid var(--line); padding: 6px 4px; text-align: right; }
table.data th:first-child, table.data td:first-child { text-align: left; }
.cell-view { display: flex; gap: 12px; align-items: center; }
.cell-view canvas { width: 120px; height: 120px; flex: 0 0 auto; }

/* ===== 4択ラッシュ ===== */
.q-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 0.9rem; color: var(--muted); }
.stars { color: var(--warn); letter-spacing: 1px; font-weight: 700; }
.q-text { font-size: 1.05rem; font-weight: 600; white-space: pre-line; }
.q-chart { margin: 8px 0; }
.choices { display: grid; gap: 8px; margin: 10px 0 0; }
.choice {
  display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left;
  min-height: 48px; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line);
  background: var(--surface); cursor: pointer; font-weight: 500;
}
.choice .key { flex: 0 0 auto; font-weight: 800; color: var(--muted); }
.choice.correct { border-color: var(--ok); background: var(--ok-soft); }
.choice.wrong { border-color: var(--ng); background: var(--ng-soft); }
.choice .verdict { margin-left: auto; font-weight: 800; white-space: nowrap; }
.choice.correct .verdict { color: var(--ok); }
.choice.wrong .verdict { color: var(--ng); }
.feedback { margin-top: 12px; padding: 12px; border-radius: 12px; border: 2px solid var(--line); }
.feedback.ok { border-color: var(--ok); }
.feedback.ng { border-color: var(--ng); }
.feedback .verdict-title { font-weight: 800; font-size: 1.1rem; }
.feedback.ok .verdict-title { color: var(--ok); }
.feedback.ng .verdict-title { color: var(--ng); }
.score-big { font-size: 2.4rem; font-weight: 800; text-align: center; margin: 4px 0; }

/* ===== ミスサマリー ===== */
.miss-item { border-top: 1px solid var(--line); padding: 10px 0; }
.miss-item:first-child { border-top: 0; }
.miss-item .q-text { font-size: 0.98rem; }
.ans-line { font-size: 0.92rem; }
.ans-line b.ng { color: var(--ng); }
.ans-line b.ok { color: var(--ok); }
.field { display: grid; gap: 4px; margin: 8px 0; }
.field label { font-weight: 600; }
.preview-img { width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px; margin-top: 8px; }

/* ===== 用語帳 ===== */
.term { border-top: 1px solid var(--line); padding: 10px 0; }
.term:first-child { border-top: 0; }
.term dt { font-weight: 800; }
.term dd { margin: 2px 0 0; }
.search { width: 100%; min-height: 44px; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }

/* ===== バッジ ===== */
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.badge {
  border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--surface);
  display: grid; gap: 2px; align-content: start;
}
.badge .icon { font-size: 1.6rem; line-height: 1.2; }
.badge .name { font-weight: 800; }
.badge.locked { opacity: 0.55; }
.badge.locked .icon { filter: grayscale(1); }
.badge .state { font-size: 0.8rem; font-weight: 700; }
.badge:not(.locked) .state { color: var(--ok); }
textarea.code { min-height: 96px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.9rem; word-break: break-all; }

/* ===== トースト ===== */
.toast {
  position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  max-width: min(92vw, 520px); background: var(--fg); color: var(--bg);
  padding: 10px 16px; border-radius: 12px; font-weight: 600; z-index: 20; box-shadow: var(--shadow);
}

@media (min-width: 640px) {
  main { padding-top: 20px; }
  .home-links { grid-template-columns: repeat(4, 1fr); }
  .calc-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
}

/* ===== 表の横スクロール・塩基配列（B7〜B9） ===== */
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; }
.table-scroll table.data { min-width: 100%; width: max-content; }
.table-scroll th, .table-scroll td { white-space: nowrap; }
.seg.many button { flex: 0 1 auto; padding-left: 12px; padding-right: 12px; white-space: nowrap; }
.seq-view { display: grid; gap: 10px; margin-top: 6px; }
.seq-row { display: grid; gap: 4px; }
.seq-blocks { display: flex; flex-wrap: wrap; gap: 4px; }
.codon { border: 1px solid var(--line); border-radius: 8px; padding: 4px 5px; min-width: 3.6em; text-align: center; background: var(--surface); }
.codon.alt { background: var(--surface-2); }
.codon.outside { border-style: dashed; color: var(--muted); }
.codon.changed { border: 2px solid var(--c2); }
.codon.stop .aa { font-weight: 700; }
.codon .seq { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 1.02rem; letter-spacing: 0.08em; }
.codon .seq.rna { color: var(--c1); }
.codon .aa { font-size: 0.74rem; line-height: 1.25; margin-top: 2px; word-break: break-all; }
.codon .mut { background: var(--ng-soft); color: var(--ng); font-weight: 700; border-radius: 3px; outline: 1px solid var(--ng); }
.codon-table td { vertical-align: top; font-size: 0.78rem; line-height: 1.45; white-space: nowrap; }
.codon-table td div.used { font-weight: 700; color: var(--c1); }
.codon-table td div.used::before { content: "▶"; font-size: 0.7em; margin-right: 2px; }
.legend .swatch { display: inline-block; width: 22px; height: 12px; margin-right: 6px; border: 1px solid var(--fg); vertical-align: -1px; }
.legend .swatch.oval { border-radius: 50%; }
.legend .swatch.dot { width: 12px; border-radius: 50%; }
.legend .swatch.rep { clip-path: polygon(0 0, 100% 0, 100% 60%, 70% 60%, 70% 100%, 30% 100%, 30% 60%, 0 60%); border: 0; }
.legend .swatch.wave { height: 4px; border: 0; vertical-align: 3px; }
table.data tr.hl td { background: var(--accent-soft); font-weight: 700; }

</style>
</head>

<header class="topbar">
  <button type="button" class="icon-btn" id="btn-back" aria-label="戻る" hidden>←</button>
  <a class="brand" href="#/home" aria-label="ホームへ">BIOLOGY</a>
  <span class="topbar-spacer"></span>

<main id="app" tabindex="-1">
  <noscript><p class="panel">このアプリを使うには JavaScript を有効にしてください。</p></noscript>
</main>

    { term: '血清療法', desc: '他の動物につくらせた抗体をふくむ血清を注射して、すぐに抗原を無毒化する治療法。' },
  ],
  b4: [
    { term: '光合成速度', desc: '単位時間あたりに光合成で吸収するCO₂の量など。光合成速度 ＝ 見かけの光合成速度 ＋ 呼吸速度。' },
    { term: '見かけの光合成速度', desc: '実際に測定されるCO₂吸収速度。光合成で吸収したCO₂から呼吸で放出したCO₂を差し引いた値。' },
    { term: '呼吸速度', desc: '呼吸でCO₂を放出する速さ。光の有無にかかわらず行われるので、暗黒でのCO₂放出速度として測れる。' },
    { term: '補償点（光補償点）', desc: '光合成速度と呼吸速度が等しくなり、見かけの光合成速度が0になる光の強さ。光合成は止まっていない。' },
    { term: '光飽和点', desc: 'それ以上光を強くしても光合成速度がほとんど大きくならない光の強さ。' },
    { term: '限定要因', desc: '光合成速度を決めている、最も不足している条件（光の強さ・CO₂濃度・温度など）。' },
    { term: '陽生植物', desc: '強い光のもとでよく成長する植物。補償点・光飽和点がともに高く、最大の光合成速度も大きい。' },
    { term: '陰生植物', desc: '弱い光のもとでも成長できる植物。呼吸速度が小さく、補償点・光飽和点がともに低い。' },
    { term: '陽樹・陰樹', desc: '陽樹は芽生えが強い光のもとでよく育つ樹木、陰樹は芽生えが暗い林床でも育つ樹木。' },
    { term: '極相（極相林）', desc: '遷移が進んで、構成する種が大きく変化しなくなった安定した状態。日本の多くの地域では陰樹林が極相となる。' },
  ],
  b5: [
    { term: '食物連鎖・食物網', desc: '被食者と捕食者のつながりが鎖のように続く関係が食物連鎖。実際には複雑な網目状になっており、食物網という。' },
    { term: '栄養段階', desc: '生産者・一次消費者・二次消費者…のように、食物連鎖の各段階。' },
    { term: 'キーストーン種', desc: '個体数は多くなくても、生態系のバランスを保つうえで大きな影響をもつ種。例：ラッコ、岩礁のヒトデ。' },
    { term: '間接効果', desc: 'ある生物が、直接の捕食・被食関係のない生物に、ほかの生物を介して影響をおよぼすこと。' },
    { term: '生態系のバランス', desc: '生物の種類や個体数が変動しながらも、一定の範囲内に保たれている状態。' },
    { term: '復元力', desc: 'かく乱を受けても、その程度が小さければ元の状態に戻る生態系の性質。' },
    { term: 'ケルプ', desc: 'コンブのなかまの大型の褐藻。海中に森のような群落（ケルプの森）をつくり、多くの生物のすみかになる。' },
    { term: 'かく乱', desc: '台風・山火事・人間の活動などで、生態系の状態が乱されること。' },
  ],
  b6: [
    { term: 'ヘモグロビン', desc: '赤血球に含まれる、鉄を含むタンパク質。酸素分圧の高いところで酸素と結合し、低いところで酸素を離す。' },
    { term: '酸素ヘモグロビン', desc: 'ヘモグロビンが酸素と結合したもの。肺胞でつくられ、組織で酸素を離してヘモグロビンにもどる。' },
    { term: '酸素解離曲線', desc: '酸素分圧と、全ヘモグロビンのうち酸素ヘモグロビンになっているものの割合（%）の関係を表したグラフ。S字形になる。' },
    { term: '分圧', desc: '混合気体の中で、ある気体が占める圧力。肺胞はO₂分圧が高くCO₂分圧が低い。組織はO₂分圧が低くCO₂分圧が高い。教科書の図では相対値で示すことが多い（例：肺胞 O₂ 100・CO₂ 40、組織 O₂ 30・CO₂ 70）。' },
    { term: 'CO₂分圧の影響', desc: 'CO₂分圧が高いほど曲線は右にずれ、同じO₂分圧でも酸素ヘモグロビンの割合が小さくなる。さかんに呼吸する組織ほど酸素を受け取りやすい。' },
    { term: '組織で放出される酸素の割合', desc: '肺で酸素と結合していたヘモグロビンのうち、組織で酸素を離したものの割合 ＝（肺での割合 − 組織での割合）÷ 肺での割合 × 100。' },
    { term: '胎児のヘモグロビン（発展）', desc: '母親のヘモグロビンより酸素と結合しやすい（曲線が左にある）。そのため胎盤で母親の血液から酸素を受け取れる。' },
  ],
  b7: [
    { term: 'ネフロン（腎単位）', desc: '腎小体と細尿管からなる、尿をつくる基本単位。ヒトの腎臓1個に約100万個ある。' },
    { term: '腎小体', desc: '糸球体とそれを包むボーマンのうをあわせた構造（マルピーギ小体）。ここで血液がろ過される。' },
    { term: 'ろ過', desc: '糸球体の血液から、血球やタンパク質以外の成分がボーマンのうへこし出されること。こし出された液が原尿。' },
    { term: '再吸収', desc: '原尿が細尿管（腎細管）・集合管を流れる間に、水・グルコース・無機塩類などが毛細血管へもどされること。グルコースはふつうすべて再吸収される。' },
    { term: '濃縮率', desc: '尿中の濃度 ÷ 血しょう中の濃度。尿中で何倍に濃くなったかを表す。再吸収されにくい物質ほど大きい。' },
    { term: 'イヌリン', desc: '植物がつくる多糖類。静脈に注射すると、ろ過されるが再吸収も分泌もされないので、原尿量 ＝ 尿量 × イヌリンの濃縮率 で原尿量を求められる。' },
    { term: '再吸収率', desc: '（原尿中の量 − 尿中の量）÷ 原尿中の量。原尿中の量 ＝ 原尿量 × 濃度、尿中の量 ＝ 尿量 × 濃度。' },
    { term: 'バソプレシン', desc: '脳下垂体後葉から分泌されるホルモン。集合管での水の再吸収を促進し、尿量を減らす。' },
    { term: '鉱質コルチコイド', desc: '副腎皮質から分泌されるホルモン。細尿管でのナトリウムイオンの再吸収を促進する。' },
  ],
  b8: [
    { term: 'バイオーム（生物群系）', desc: 'その地域の気候に応じて成立する植生と、そこにすむ動物などの生物のまとまり。陸上では主に年平均気温と年降水量で決まる。' },
    { term: '森林・草原・荒原', desc: '年降水量が多いと森林、少ないと草原、非常に少ないか気温が非常に低いと荒原になる。' },
    { term: '熱帯多雨林・亜熱帯多雨林', desc: '高温多雨の地域の常緑広葉樹林。熱帯多雨林は種類が非常に多く、高木が層をなす。日本の南西諸島には亜熱帯多雨林（ガジュマル・アコウ・ヘゴ、海岸のマングローブ）が分布する。' },
    { term: '照葉樹林', desc: '暖温帯の常緑広葉樹林。葉の表面に光沢がある。日本では関東〜九州の低地（スダジイ・タブノキ・アラカシ）。' },
    { term: '夏緑樹林', desc: '冷温帯の落葉広葉樹林。冬に葉を落とす。日本では東北地方・北海道南西部など（ブナ・ミズナラ）。' },
    { term: '針葉樹林', desc: '亜寒帯の、おもに常緑針葉樹からなる森林（落葉針葉樹のカラマツ類も含む）。日本では北海道東北部（エゾマツ・トドマツ）や本州中部の亜高山帯（シラビソ・オオシラビソ・コメツガ）。' },
    { term: '硬葉樹林・雨緑樹林', desc: '硬葉樹林は夏に乾燥し冬に雨が多い地域の常緑樹林（オリーブ・コルクガシ）。雨緑樹林は雨季と乾季のある熱帯の、乾季に落葉する森林（チーク）。' },
    { term: 'サバンナ・ステップ', desc: 'どちらも降水量の少ない地域の草原。熱帯の草原がサバンナ（樹木がまばら）、温帯の草原がステップ。' },
    { term: '砂漠・ツンドラ', desc: '荒原。砂漠は降水量が非常に少ない地域、ツンドラは年平均気温が非常に低い地域（コケ植物・地衣類）。' },
    { term: '水平分布', desc: '緯度（主に気温）に応じたバイオームの分布。日本では南から亜熱帯多雨林→照葉樹林→夏緑樹林→針葉樹林。' },
    { term: '垂直分布', desc: '標高に応じたバイオームの分布。本州中部では丘陵帯（照葉樹林）・山地帯（夏緑樹林）・亜高山帯（針葉樹林）・高山帯。標高が100 m 上がるごとに気温は約0.5〜0.6℃下がる。' },
    { term: '森林限界', desc: 'それより高い所では高木の森林が成立しなくなる境界。本州中部では標高約2500 m。上の高山帯にはハイマツや高山草原（お花畑）が見られる。' },
    { term: '暖かさの指数（発展）', desc: '月平均気温が5℃をこえる月について（月平均気温 − 5）を合計した値。0〜15 ツンドラ、15〜45 針葉樹林、45〜85 夏緑樹林、85〜180 照葉樹林、180〜240 亜熱帯多雨林、240以上 熱帯多雨林。' },
  ],
  b9: [
    { term: '転写', desc: 'DNAの塩基配列をもとに、相補的な塩基をもつmRNAがつくられること。真核生物では核の中で起こる。' },
    { term: '翻訳', desc: 'mRNAの塩基配列をもとにアミノ酸がつながり、タンパク質がつくられること。細胞質のリボソームで起こる。' },
    { term: '鋳型鎖', desc: 'DNAの2本の鎖のうち、転写のときに写しとられる側の鎖。mRNAは鋳型鎖と相補的な塩基配列になる。「生物」では、DNAの鎖に5′末端・3′末端の向きがあり、mRNAは鋳型鎖と逆向き（5′→3′の向き）に合成されることを学ぶ。' },
    { term: 'RNA', desc: '糖がリボース、塩基がA・U（ウラシル）・G・Cの核酸。ふつう1本鎖。DNAのAに対してはUが対応する。' },
    { term: 'コドン', desc: 'mRNAの連続した3つの塩基の並び。1つのコドンが1つのアミノ酸（または終止）を指定する。4³＝64通りある。' },
    { term: '遺伝暗号表', desc: 'コドンとアミノ酸の対応表。AUGはメチオニンを指定し、翻訳の開始点（開始コドン）にもなる。UAA・UAG・UGAは終止コドン。' },
    { term: '突然変異（置換）', desc: '1つの塩基が別の塩基に置きかわること。アミノ酸が1つ変わる、変わらない、途中に終止コドンができる、などが起こる（終止コドンがなくなる、開始コドンがこわれる場合もある）。「生物」で詳しく学ぶ。' },
    { term: '突然変異（欠失・挿入）', desc: '塩基がなくなる・加わること。1塩基（3の倍数でない数）の欠失・挿入では、それより後ろの読み枠がずれ（フレームシフト）、多くのアミノ酸が変わりやすい。「生物」で詳しく学ぶ。' },
  ],
  b10: [
    { term: 'ヌクレオチド', desc: 'リン酸・糖・塩基が結合したもの。DNAの糖はデオキシリボースで、塩基はA（アデニン）・T（チミン）・G（グアニン）・C（シトシン）。' },
    { term: '二重らせん構造', desc: '2本のヌクレオチド鎖が内側の塩基どうしで結合し、ねじれた構造。ワトソンとクリックが提唱した。' },
    { term: '相補性', desc: 'AとT、GとCが必ず対をつくる性質。一方の鎖の塩基配列が決まれば、もう一方の鎖の塩基配列も決まる。' },
    { term: 'シャルガフの規則', desc: 'どの生物の2本鎖DNAでも、Aの割合＝Tの割合、Gの割合＝Cの割合となる規則。AとTの割合は生物によって異なる。' },
    { term: '塩基対とDNAの長さ', desc: '2本鎖DNAは10塩基対でらせんが1回転し、その長さは約3.4 nm（1塩基対あたり0.34 nm）。' },
    { term: 'ゲノム', desc: 'その生物が生命活動を営むのに必要な1組の遺伝情報。ヒトのゲノムは約30億塩基対で、遺伝子は約2万個。体細胞はゲノムを2組もつ。' },
  ],
  b11: [
    { term: '遷移', desc: '植生が時間とともに移り変わっていくこと。' },
    { term: '一次遷移', desc: '溶岩台地など、土壌のない裸地から始まる遷移。荒原 → 草原 → 低木林 → 陽樹林 → 混交林 → 陰樹林と進む。' },
    { term: '二次遷移', desc: '山火事や伐採のあとなど、土壌や種子・根などが残っている場所から始まる遷移。一次遷移より速く進む。' },
    { term: '先駆種', desc: '遷移の初期に裸地に侵入する生物。地衣類やコケ植物など、乾燥や貧栄養に強い。' },
    { term: '陽樹', desc: '強い光のもとで成長が速いが、補償点が高く、暗い林床では芽ばえが育たない樹木。アカマツ・コナラなど。' },
    { term: '陰樹', desc: '補償点が低く、暗い林床でも芽ばえが育つ樹木。スダジイ・タブノキ・アラカシなど。' },
    { term: '極相（極相林）', desc: '遷移が進んで、大きく変化しなくなった安定した状態（森林）。暖温帯では陰樹林。' },
    { term: '相対照度', desc: '林床の照度 ÷ 林外の照度 × 100（%）。林床の明るさを比べるのに使う。' },
    { term: 'ギャップ', desc: '高木が倒れるなどしてできた林冠のすき間。林床まで光が届き、陽樹も育つことがある（ギャップ更新）。' },
  ],
  a1: [
    { term: '酵素', desc: '生体内の化学反応を促進する触媒としてはたらくタンパク質。反応の前後で変化せず、くり返しはたらく。' },
    { term: '基質・活性部位', desc: '酵素が作用する物質が基質。酵素の中で基質が結合して反応が起こる部分が活性部位。' },
    { term: '基質特異性', desc: '酵素が特定の基質にだけ作用する性質。活性部位の立体構造に合う基質としか結合できないため。' },
    { term: '酵素−基質複合体', desc: '酵素と基質が一時的に結合したもの。基質濃度が十分高いとほぼすべての酵素がこの状態になり、反応速度が最大（Vmax）になる。' },
    { term: 'ミカエリス・メンテンの式（発展）', desc: '高校の教科書の範囲外（大学で学ぶ内容）。v ＝ Vmax[S]／(Km＋[S])。基質濃度 [S] と反応速度 v の関係を表す。' },
    { term: 'ミカエリス定数 Km（発展）', desc: '高校の教科書の範囲外（大学で学ぶ内容）。反応速度が最大速度の半分（Vmax/2）になるときの基質濃度。小さいほど酵素と基質が結合しやすい。' },
    { term: '競争的阻害', desc: '基質と似た阻害剤が活性部位を基質と奪い合う阻害。見かけの Km が大きくなるが、Vmax は変わらない。基質濃度を高くすると影響が小さくなる。' },
    { term: '非競争的阻害', desc: '阻害剤が活性部位以外に結合して酵素のはたらきを失わせる阻害。Vmax が小さくなり、Km は変わらない。' },
    { term: 'ラインウィーバー・バークのプロット（発展）', desc: '高校の教科書の範囲外（大学で学ぶ内容）。1/v を縦軸、1/[S] を横軸にとったグラフ。1/v ＝ (Km/Vmax)(1/[S]) ＋ 1/Vmax の直線になり、y切片が 1/Vmax、x切片が −1/Km、傾きが Km/Vmax。' },
    { term: '最適温度・失活', desc: '反応速度が最大になる温度が最適温度。高温では酵素タンパク質が熱変性して失活し、温度を下げても戻らない（不可逆的）。' },
    { term: '最適pH', desc: '酵素が最もよくはたらく pH。ペプシン約2、だ液アミラーゼ約7、トリプシン約8。' },
  ],
  a2: [
    { term: '顕性・潜性', desc: 'ヘテロ接合体で表現型に現れるほうの形質が顕性形質、現れないほうが潜性形質。「優れている・劣っている」という意味ではない。' },
    { term: '遺伝子型・表現型', desc: 'AA・Aa・aa のような遺伝子の組合せが遺伝子型。[A]・[a] のように実際に現れる形質が表現型。' },
    { term: 'ホモ接合・ヘテロ接合', desc: '対立遺伝子が同じ（AA、aa）ならホモ接合、異なる（Aa）ならヘテロ接合。' },
    { term: '分離の法則', desc: '対になっている対立遺伝子は、配偶子をつくるときに分かれて別々の配偶子に入る。Aa は A : a ＝ 1 : 1 の配偶子をつくる。' },
    { term: '独立の法則', desc: '別々の染色体にある2組の対立遺伝子は、互いに影響せずに配偶子に分配される。F2 は 9 : 3 : 3 : 1 になる。' },
    { term: '検定交雑', desc: '潜性ホモ接合体（aa、aabb）との交配。子の表現型の比が、調べる個体のつくる配偶子の比をそのまま表す。' },
    { term: '連鎖', desc: '2組以上の対立遺伝子が同じ染色体上にあり、いっしょに配偶子に入る傾向があること。' },
    { term: '乗換え・組換え', desc: '減数分裂の第一分裂前期に対合した相同染色体の一部が交換されること（乗換え）で、遺伝子の組合せが変わること（組換え）。' },
    { term: '組換え価', desc: '組換え価(%) ＝ 組換えで生じた配偶子（個体）の数 ÷ 全体の数 × 100。遺伝子間の距離が大きいほど大きく、50%以下になる。' },
  ],
  a3: [
    { term: '個体群', desc: 'ある地域に生活する同種の個体の集まり。' },
    { term: '個体群密度', desc: '単位面積（または体積）あたりの個体数。' },
    { term: '成長曲線', desc: '個体群の個体数の時間変化を表したグラフ。実際の環境ではS字形（ロジスティック曲線）になることが多い。' },
